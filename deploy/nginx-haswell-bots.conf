# Proxy for bots.<your-domain>. On HestiaCP, add the domain in the panel (with
# Let's Encrypt SSL), then put these location blocks in a custom template or
# /home/<user>/conf/web/bots.<domain>/nginx.ssl.conf_custom.

location / {
    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Article writing and image generation can take a minute.
    proxy_read_timeout 300s;
    client_max_body_size 12m;
}
